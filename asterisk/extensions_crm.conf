; /etc/asterisk/extensions_crm.conf – IntelReach Calling CRM
; Included at the END of extensions.conf:   #include extensions_crm.conf
; Every decision (who may call where, which trunk and caller ID, who rings, record?) is made by the
; CRM over CURL on 127.0.0.1:@CRM_PORT@, so the dialplan never needs editing.
; Needs func_curl (asterisk -rx "module show like func_curl").

; ---------- agents dialling out ----------
; +<country><number>  or  00<country><number>  (e.g. +442079460958, 00923001234567)
[crm-agents]
exten => _+X.,1,Goto(crm-out,${EXTEN},1)
exten => _00X.,1,Goto(crm-out,+${EXTEN:2},1)
; echo test – checks the browser <-> Asterisk audio path without any trunk
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[crm-out]
exten => _+X.,1,NoOp(CRM call ${CHANNEL(endpoint)} -> ${EXTEN})
 same => n,Set(CRMID=${PJSIP_HEADER(read,X-CRM-Call)})
 same => n,Set(R=${CURL(http://127.0.0.1:@CRM_PORT@/ast/authorize?s=@CRM_SECRET@&ext=${CHANNEL(endpoint)}&to=${URIENCODE(${EXTEN})}&call=${CRMID})})
 same => n,GotoIf($["${CUT(R,|,1)}" != "ok"]?deny)
 same => n,Set(CRMID=${CUT(R,|,3)})
 same => n,Set(CALLERID(num)=${CUT(R,|,2)})
 same => n,Set(CALLERID(name)=)
 same => n,Set(CHANNEL(hangup_handler_push)=crm-hangup,s,1(${CRMID}))
 ; recording (Admin → Settings → Record calls), only the connected part
 same => n,ExecIf($["${CUT(R,|,5)}" = "1"]?MixMonitor(@REC_DIR@/${CRMID}.wav,b))
 ; trunk (crm-trunk-<id>) and the number in the format that vendor wants are chosen by the CRM
 same => n,Dial(PJSIP/${CUT(R,|,7)}@${CUT(R,|,6)},90,S(${CUT(R,|,4)}))
 same => n,Hangup()
 same => n(deny),NoOp(CRM refused: ${R})
 same => n,Hangup(21)

; ---------- calls to the Twilio number (via the CRM webhook) ----------
[crm-from-twilio]
exten => crm,1,NoOp(CRM incoming from ${CALLERID(num)})
 same => n,Set(CRMID=${PJSIP_HEADER(read,X-CRM-Call)})
 same => n,Set(R=${CURL(http://127.0.0.1:@CRM_PORT@/ast/route?s=@CRM_SECRET@&call=${CRMID})})
 same => n,GotoIf($[${LEN(${R})} = 0]?none)
 same => n,GotoIf($["${CUT(R,|,1)}" = "none"]?none)
 same => n,Set(CALLERID(name)=${CUT(R,|,2)})
 same => n,Set(CHANNEL(hangup_handler_push)=crm-hangup,s,1(${CRMID}))
 same => n,ExecIf($["${CUT(R,|,4)}" = "1"]?MixMonitor(@REC_DIR@/${CRMID}.wav,b))
 ; ring every online agent at once; first to answer gets the call
 same => n,Dial(${CUT(R,|,1)},${CUT(R,|,3)},b(crm-agent-hdr^s^1(${CRMID})))
 same => n,Hangup()
 ; nobody online: busy -> Twilio's after-dial hands the call to GHL
 same => n(none),Hangup(17)
; a number on a Twilio Elastic SIP trunk (origination): only if it is in Admin → SIP trunks → Numbers
exten => _[+0-9].,1,Goto(crm-from-trunk,${EXTEN},1)
; anything else arriving from Twilio IPs has no match here and is refused (404)

; ---------- calls to numbers on SIP trunks (Admin → SIP trunks → Numbers) ----------
; Request-URI user is usually the number; registration-style providers may send our username instead
; (the CRM then looks at the To header). CRM_TRUNK is set by the trunk endpoint.
[crm-from-trunk]
exten => _[+0-9a-zA-Z].,1,Set(DID=${EXTEN})
 same => n,Goto(crm-trunk-in,s,1)
exten => s,1,Set(DID=)
 same => n,Goto(crm-trunk-in,s,1)

[crm-trunk-in]
exten => s,1,NoOp(CRM incoming via trunk ${CRM_TRUNK} to ${DID} from ${CALLERID(num)})
 same => n,Set(R=${CURL(http://127.0.0.1:@CRM_PORT@/ast/inbound?s=@CRM_SECRET@&trunk=${CRM_TRUNK}&did=${URIENCODE(${DID})}&to=${URIENCODE(${PJSIP_HEADER(read,To)})}&src=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($[${LEN(${R})} = 0]?none)
 same => n,GotoIf($["${CUT(R,|,1)}" = "none"]?none)
 same => n,Set(CRMID=${CUT(R,|,5)})
 same => n,Set(CALLERID(name)=${CUT(R,|,2)})
 same => n,Set(CHANNEL(hangup_handler_push)=crm-hangup,s,1(${CRMID}))
 same => n,ExecIf($["${CUT(R,|,4)}" = "1"]?MixMonitor(@REC_DIR@/${CRMID}.wav,b))
 same => n,Dial(${CUT(R,|,1)},${CUT(R,|,3)},b(crm-agent-hdr^s^1(${CRMID})))
 same => n,Hangup()
 same => n(none),Hangup(17)

; Runs on each ringing agent channel: tells the browser which CRM call this is.
[crm-agent-hdr]
exten => s,1,Set(PJSIP_HEADER(add,X-CRM-Call)=${ARG1})
 same => n,Return()

; Final status + talk time back to the CRM when the call ends.
[crm-hangup]
exten => s,1,Set(R=${CURL(http://127.0.0.1:@CRM_PORT@/ast/hangup?s=@CRM_SECRET@&call=${ARG1}&status=${DIALSTATUS}&answered=${ANSWEREDTIME}&cause=${HANGUPCAUSE}&peer=${URIENCODE(${DIALEDPEERNAME})})})
 same => n,Return()
