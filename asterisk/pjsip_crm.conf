; /etc/asterisk/pjsip_crm.conf – IntelReach Calling CRM
; Included at the END of pjsip.conf:   #include pjsip_crm.conf
; Nothing here changes the existing WebRTC users (1001, 1002, 1100+).
; deploy/install.sh fills in the @PLACEHOLDERS@.

; ---------- SIP over UDP 5060 – only for the SIP providers ----------
; The firewall (ufw) opens 5060/udp to Twilio's / Telnyx's signalling ranges and the IPs set per trunk.
[transport-udp-crm]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@PUBLIC_IP@
external_signaling_address=@PUBLIC_IP@
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; ---------- Calls to the Twilio number (CRM webhook <Dial><Sip>) ----------
; Arrive from Twilio's signalling IPs (identify below) into context crm-from-twilio.
; Twilio Elastic SIP trunk origination (numbers on a Twilio trunk) arrives here too.
[twilio-inbound]
type=endpoint
transport=transport-udp-crm
context=crm-from-twilio
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
trust_id_inbound=yes
rtp_timeout=60

; Twilio signalling IP ranges (all regions). Keep in sync with
; https://www.twilio.com/docs/sip-trunking/ip-addresses
[twilio-inbound-identify]
type=identify
endpoint=twilio-inbound
match=54.172.60.0/23
match=34.203.250.0/23
match=54.244.51.0/24
match=54.171.127.192/26
match=52.215.127.0/24
match=35.156.191.128/25
match=3.122.181.0/24
match=54.65.63.192/26
match=3.112.80.0/24
match=54.169.127.128/26
match=3.1.77.0/24
match=54.252.254.64/26
match=3.104.90.0/24
match=177.71.206.192/26
match=18.228.249.0/24

; ---------- Outgoing SIP trunks (any vendor) ----------
; Admin → SIP trunks writes this file (endpoints crm-trunk-<id>); intelreach-crm-trunks.path reloads PJSIP.
#tryinclude @TRUNKS_DIR@/pjsip_trunks.conf

; ---------- CRM agent phones (browser, WebRTC over wss://pbx…/ws) ----------
; Extensions 2001+ are generated into pjsip_crm_agents.conf by
; scripts/gen_agent_pool.py. They live in context crm-agents, so they can only
; reach the PSTN through the CRM's checks – never the classroom users.
[crm-agent](!)
type=endpoint
webrtc=yes
context=crm-agents
disallow=all
allow=ulaw,alaw
direct_media=no
dtls_auto_generate_cert=yes
dtmf_mode=rfc4733
rtp_timeout=30

[crm-agent-auth](!)
type=auth
auth_type=userpass

[crm-agent-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

#include pjsip_crm_agents.conf
