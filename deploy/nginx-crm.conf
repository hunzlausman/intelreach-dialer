# /etc/nginx/sites-available/intelreach-crm.conf
# install.sh fills in @SSL_LISTEN@: "443 ssl http2" when nginx serves port 443 itself, or
# "127.0.0.1:8443 ssl http2" when a stream SNI router on 443 forwards to 127.0.0.1:8443.

server {
    listen 80;
    server_name @CRM_DOMAIN@;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

#SSL_START
server {
    listen @SSL_LISTEN@;
    server_name @CRM_DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@CRM_DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@CRM_DOMAIN@/privkey.pem;

    client_max_body_size 10m;          # CSV contact imports

    # Asterisk hooks are for 127.0.0.1 only – never from the internet
    location /ast/ { return 404; }

    # live call audio from Telnyx / Twilio (WebSocket) to the AI voice engine
    location /media/ {
        proxy_pass http://127.0.0.1:@CRM_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:@CRM_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
#SSL_END
