<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IntelReach CRM</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/jssip.min.js"></script>
</head>
<body>
  <!-- sign in -->
  <section id="login" class="login" hidden>
    <form id="loginForm" class="card login-card">
      <div class="brand big"><span class="logo">IR</span> IntelReach CRM</div>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="loginError"></p>
      <button class="btn primary wide" type="submit">Sign in</button>
    </form>
  </section>

  <!-- app -->
  <section id="app" class="shell" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo">IR</span> <span id="companyName">IntelReach CRM</span></div>
      <nav id="nav">
        <a href="#/contacts" data-view="contacts">Contacts</a>
        <a href="#/calls" data-view="calls">Calls</a>
        <a href="#/campaigns" data-view="campaigns">Campaigns</a>
        <a href="#/agents" data-view="agents" class="admin-only">AI agents</a>
        <a href="#/admin" data-view="admin" class="admin-only">Admin</a>
      </nav>
      <div class="top-right">
        <label class="switch" title="Ring me for calls to the Twilio number">
          <input type="checkbox" id="availToggle"> <span>Taking calls</span>
        </label>
        <span id="lineStatus" class="pill">Phone off</span>
        <span id="userName" class="muted"></span>
        <button class="btn ghost small" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <main class="layout">
      <div id="view" class="view"></div>
      <aside class="side">
        <div class="phone card" id="phonePanel"></div>
        <div class="card assist" id="assistPanel" hidden></div>
      </aside>
    </main>
  </section>

  <div id="modal" class="modal" hidden><div class="card modal-card" id="modalCard"></div></div>
  <div id="toast" class="toast" hidden></div>
  <audio id="remoteAudio" autoplay></audio>

  <script type="module" src="/app.js"></script>
</body>
</html>
